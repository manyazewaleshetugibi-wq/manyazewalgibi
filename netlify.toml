[build]
  command = "npm install --legacy-peer-deps --force && npm run build"
  publish = ".next"

[build.environment]
  NODE_ENV = "production"
  # Dummy values for build (safe to commit)
  MONGODB_URI = "mongodb://localhost:27017/dummy"
  MONGODB_DATABASE = "dummy"
  NEXTAUTH_SECRET = "dummy-secret-for-build-only-change-in-production"
  NEXTAUTH_URL = "http://localhost:3000"

# Production environment variables (set in Netlify UI, not here!)
# DO NOT put real secrets in this file!
# [context.production.environment]
#   MONGODB_URI = "set-this-in-netlify-dashboard"
#   MONGODB_DATABASE = "set-this-in-netlify-dashboard"
#   NEXTAUTH_SECRET = "set-this-in-netlify-dashboard"
#   NEXTAUTH_URL = "https://your-site-name.netlify.app"